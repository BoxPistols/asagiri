<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Semantic colors</title>
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border-subtle); }
  .chip { height: 60px; display: flex; align-items: flex-end; padding: 8px; color: var(--color-text-on-brand); font-size: 10px; font-weight: 500; letter-spacing: 0.05em; }
  .meta { padding: 8px 10px; background: var(--color-surface); font-size: 11px; }
  .name { font-weight: 600; color: var(--color-text-primary); }
  .token { color: var(--color-text-tertiary); font-family: "SF Mono", Monaco, monospace; font-size: 10px; }
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <h4>Semantic — base color</h4>
  <div class="grid">
    <div class="sw"><div class="chip" style="background: var(--color-success)">success</div><div class="meta"><div class="token">--color-success</div></div></div>
    <div class="sw"><div class="chip" style="background: var(--color-warning); color: var(--color-on-warning)">warning</div><div class="meta"><div class="token">--color-warning</div></div></div>
    <div class="sw"><div class="chip" style="background: var(--color-danger)">danger</div><div class="meta"><div class="token">--color-danger</div></div></div>
    <div class="sw"><div class="chip" style="background: var(--color-info)">info</div><div class="meta"><div class="token">--color-info</div></div></div>
    <div class="sw"><div class="chip" style="background: var(--color-accent)">accent</div><div class="meta"><div class="token">--color-accent</div></div></div>
    <div class="sw"><div class="chip" style="background: var(--color-elegant)">elegant</div><div class="meta"><div class="token">--color-elegant</div></div></div>
  </div>
</div>
</body></html>
