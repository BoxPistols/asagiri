<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Type scale</title>
<style>
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .row { display: grid; grid-template-columns: 64px 1fr 84px; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px solid var(--color-border-subtle); }
  .row:last-child { border: 0; }
  .tag { font-family: "SF Mono", Monaco, monospace; font-size: 10px; color: var(--color-text-tertiary); }
  .spec { font-family: "SF Mono", Monaco, monospace; font-size: 10px; color: var(--color-text-tertiary); text-align: right; }
  .sample { font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.06em; line-height: 1.2; }
  .h1 { font-size: 44px; letter-spacing: -0.1rem; }
  .h2 { font-size: 34px; letter-spacing: -0.1rem; }
  .h3 { font-size: 26px; letter-spacing: -0.1rem; }
  .h4 { font-size: 20px; letter-spacing: -0.08rem; }
  .h5 { font-size: 17px; letter-spacing: -0.05rem; }
  .h6 { font-size: 16px; letter-spacing: 0; }
</style>
</head><body>
<div class="card">
  <h4>Type scale — fluid clamp() headings</h4>
  <div class="row"><span class="tag">h1</span><span class="sample h1">朝霧を見る Asagiri</span><span class="spec">32–51px • 500</span></div>
  <div class="row"><span class="tag">h2</span><span class="sample h2">Morning Mist 朝霧</span><span class="spec">28–38px • 500</span></div>
  <div class="row"><span class="tag">h3</span><span class="sample h3">Section heading</span><span class="spec">24–32px • 500</span></div>
  <div class="row"><span class="tag">h4</span><span class="sample h4">Subsection heading</span><span class="spec">20–22px • 500</span></div>
  <div class="row"><span class="tag">h5</span><span class="sample h5">Small heading</span><span class="spec">18px • 500</span></div>
  <div class="row"><span class="tag">h6</span><span class="sample h6">Caption heading</span><span class="spec">16px • 500</span></div>
</div>
</body></html>
