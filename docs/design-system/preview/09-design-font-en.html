<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Design-font-en accent</title>
<style>
  h4 { margin: 0 0 18px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .design-en { font-family: "Poppins", sans-serif; color: var(--color-hotpink); letter-spacing: 0.02rem; font-weight: 500; }
  .big { font-size: 44px; width: fit-content; border-bottom: 1px dashed currentColor; padding-bottom: 4px; line-height: 1.1; }
  .med { font-size: 22px; margin-top: 20px; }
  .note { font-size: 12px; color: var(--color-text-tertiary); margin-top: 16px; font-family: "SF Mono", Monaco, monospace; }
</style>
</head><body>
<div class="card">
  <h4>Design-font-en — accent display</h4>
  <div class="design-en big">Asagiri Morning</div>
  <div class="design-en med">Poppins 500 · letter-spacing 0.02rem · --color-hotpink</div>
  <div class="note">.design-font-en — used sparingly for English display accents.<br/>h1.design-font-en adds a dashed underline the width of the text.</div>
</div>
</body></html>
