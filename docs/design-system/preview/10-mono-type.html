<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Mono type</title>
<style>
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  pre { font-family: "SF Mono", Monaco, Menlo, Consolas, monospace; background: var(--color-surface-variant); padding: 14px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.5; color: var(--color-text-code); margin: 0 0 10px; overflow-x: auto; }
  code { font-family: "SF Mono", Monaco, monospace; background: var(--color-surface-variant); padding: 2px 6px; border-radius: var(--radius-sm); font-size: 13px; color: var(--color-text-code); }
  p { margin: 6px 0; font-size: 14px; color: var(--color-text-secondary); }
</style>
</head><body>
<div class="card">
  <h4>Mono — code & inline</h4>
<pre>&lt;button class="btn-primary"&gt;Save&lt;/button&gt;
&lt;div class="alert alert-success"&gt;
  &lt;strong&gt;Success!&lt;/strong&gt; Operation completed.
&lt;/div&gt;</pre>
  <p>Inline: use <code>--color-primary</code> and <code>var(--radius-md)</code>.</p>
</div>
</body></html>
