<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Spacing scale</title>
<style>
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .row { display: grid; grid-template-columns: 90px 1fr 80px; align-items: center; gap: 14px; padding: 5px 0; font-size: 12px; }
  .bar { background: var(--color-primary); height: 14px; border-radius: var(--radius-xs); }
  .name { font-family: "SF Mono", Monaco, monospace; color: var(--color-text-primary); }
  .px { font-family: "SF Mono", Monaco, monospace; color: var(--color-text-tertiary); text-align: right; }
</style>
</head><body>
<div class="card">
  <h4>Spacing — 4px baseline</h4>
  <div class="row"><span class="name">--spacing-1</span><span class="bar" style="width: 4px"></span><span class="px">4 / 0.25r</span></div>
  <div class="row"><span class="name">--spacing-2</span><span class="bar" style="width: 8px"></span><span class="px">8 / 0.5r</span></div>
  <div class="row"><span class="name">--spacing-3</span><span class="bar" style="width: 12px"></span><span class="px">12 / 0.75r</span></div>
  <div class="row"><span class="name">--spacing-4</span><span class="bar" style="width: 16px"></span><span class="px">16 / 1r</span></div>
  <div class="row"><span class="name">--spacing-6</span><span class="bar" style="width: 24px"></span><span class="px">24 / 1.5r</span></div>
  <div class="row"><span class="name">--spacing-8</span><span class="bar" style="width: 32px"></span><span class="px">32 / 2r</span></div>
  <div class="row"><span class="name">--spacing-12</span><span class="bar" style="width: 48px"></span><span class="px">48 / 3r</span></div>
  <div class="row"><span class="name">--spacing-16</span><span class="bar" style="width: 64px"></span><span class="px">64 / 4r</span></div>
</div>
</body></html>
