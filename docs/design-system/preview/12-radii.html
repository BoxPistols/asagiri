<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Radii</title>
<style>
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .cell { text-align: center; font-size: 11px; color: var(--color-text-tertiary); }
  .box { width: 72px; height: 72px; background: var(--color-secondary); margin-bottom: 8px; }
  .box.pill { background: var(--color-primary); width: 120px; height: 40px; border-radius: var(--radius-full); }
  .name { font-family: "SF Mono", Monaco, monospace; font-size: 11px; color: var(--color-text-primary); font-weight: 600; }
  .px { font-family: "SF Mono", Monaco, monospace; font-size: 10px; color: var(--color-text-tertiary); }
</style>
</head><body>
<div class="card">
  <h4>Radii</h4>
  <div class="row">
    <div class="cell"><div class="box" style="border-radius: var(--radius-xs)"></div><div class="name">xs</div><div class="px">2px</div></div>
    <div class="cell"><div class="box" style="border-radius: var(--radius-sm)"></div><div class="name">sm</div><div class="px">4px</div></div>
    <div class="cell"><div class="box" style="border-radius: var(--radius-md)"></div><div class="name">md</div><div class="px">8px</div></div>
    <div class="cell"><div class="box" style="border-radius: var(--radius-lg)"></div><div class="name">lg</div><div class="px">12px</div></div>
    <div class="cell"><div class="box" style="border-radius: var(--radius-xl)"></div><div class="name">xl</div><div class="px">16px</div></div>
    <div class="cell"><div class="box pill"></div><div class="name">full</div><div class="px">9999px</div></div>
  </div>
</div>
</body></html>
