<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Elevation</title>
<style>
  body { background: var(--color-bg); }
  .card { background: var(--color-bg); }
  h4 { margin: 0 0 20px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .row { display: flex; gap: 22px; align-items: flex-end; padding: 6px 4px 12px; }
  .cell { text-align: center; font-size: 11px; color: var(--color-text-tertiary); }
  .box { width: 80px; height: 56px; background: var(--color-surface); border-radius: var(--radius-md); margin-bottom: 12px; }
  .e1 { box-shadow: var(--elevation-1); }
  .e2 { box-shadow: var(--elevation-2); }
  .e3 { box-shadow: var(--elevation-3); }
  .e4 { box-shadow: var(--elevation-4); }
  .e5 { box-shadow: var(--elevation-5); }
  .name { font-family: "SF Mono", Monaco, monospace; font-weight: 600; color: var(--color-text-primary); }
  .note { font-family: "SF Mono", Monaco, monospace; color: var(--color-text-tertiary); font-size: 10px; }
</style>
</head><body>
<div class="card">
  <h4>Elevation — MD3-lite shadow scale</h4>
  <div class="row">
    <div class="cell"><div class="box e1"></div><div class="name">1</div><div class="note">subtle</div></div>
    <div class="cell"><div class="box e2"></div><div class="name">2</div><div class="note">cards</div></div>
    <div class="cell"><div class="box e3"></div><div class="name">3</div><div class="note">hover</div></div>
    <div class="cell"><div class="box e4"></div><div class="name">4</div><div class="note">menus</div></div>
    <div class="cell"><div class="box e5"></div><div class="name">5</div><div class="note">modal</div></div>
  </div>
</div>
</body></html>
