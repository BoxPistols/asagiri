<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Button sizes</title>
<style>
  h4 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--color-primary); color: var(--color-on-primary); border: 0; font-weight: 500; letter-spacing: 0.1em; border-radius: var(--border-radius-all); margin-right: 8px; font-family: inherit; cursor: pointer; line-height: 1.2; }
  .sm { height: 1.95rem; padding: 0 1rem; font-size: 0.875rem; }
  .md { height: 2.45rem; padding: 0 1.6rem; font-size: 1rem; }
  .lg { height: 2.95rem; padding: 0 2rem; font-size: 1.125rem; }
  .xl { height: 3.45rem; padding: 0 2.4rem; font-size: 1.25rem; }
  .icon { width: 2.45rem; height: 2.45rem; padding: 0; border-radius: var(--radius-full); }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
</style>
</head><body>
<div class="card">
  <h4>Button sizes & icon button</h4>
  <div class="row"><button class="btn sm">Small</button><button class="btn md">Medium</button><button class="btn lg">Large</button><button class="btn xl">Extra</button></div>
  <div class="row">
    <button class="btn md icon" aria-label="add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn md icon" style="background: var(--color-danger); color: var(--color-on-danger)" aria-label="delete"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6M10 11v6M14 11v6"/></svg></button>
    <button class="btn md"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-right: 8px"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save</button>
  </div>
</div>
</body></html>
