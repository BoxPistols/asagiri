<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Form inputs</title>
<style>
  h4 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-tertiary); font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; font-weight: 500; }
  input, select, textarea { font: inherit; width: 100%; height: 2.6rem; padding: 0 0.9rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); box-sizing: border-box; background: var(--color-surface); color: var(--color-text-primary); font-size: 14px; }
  input:focus { outline: 0; border-color: var(--color-primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary) 20%, transparent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .valid { border-color: var(--color-success); }
  .invalid { border-color: var(--color-danger); }
  .feedback { font-size: 11px; margin-top: 3px; }
  .ok { color: var(--color-success); } .err { color: var(--color-danger); }
</style>
</head><body>
<div class="card">
  <h4>Form inputs — default / valid / invalid</h4>
  <div class="grid">
    <div><label>Email</label><input type="email" value="hello@example.com"></div>
    <div><label>Password</label><input type="password" value="••••••••"></div>
    <div><label>Valid</label><input class="valid" value="Correct value"><div class="feedback ok">Looks good!</div></div>
    <div><label>Invalid</label><input class="invalid" value="bad"><div class="feedback err">Please enter a valid value.</div></div>
  </div>
</div>
</body></html>
